# Rename with care. The app finds these runs by asking the API for
# actions/workflows/build-test.yml/runs, so this file's name is part of a URL that shipped
# copies already hold. The display name below is matched as well.

name: Build Test

on:
  workflow_dispatch:
  push:
    # Any branch, so pushing one is enough to show up in the Alpha channel with no naming
    # convention to follow. '**' still excludes tag pushes, which build-release.yml owns.
    branches:
      - '**'
    # Nothing here reads a markdown file, so a push that touched only those produces an installer
    # byte-identical to the one before it. Renaming Unreleased before a tag is the case that keeps
    # happening: it built the same commit build-release.yml was about to build anyway.
    paths-ignore:
      - '**.md'

# One run per branch. Pushing twice in a minute used to leave the first build finishing an
# installer nobody would install, since the second push already superseded it. A cancelled run
# uploads nothing, so an intermediate commit is not installable from the Alpha list.
concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

# Read-only. This workflow publishes nothing; the artifact upload needs no extra grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Work out a version for this branch build
        id: version
        shell: pwsh
        run: |
          # The tags decide where this build sits, not the props file. Reading the version out of
          # the props file put "-alpha.N" on whatever was last typed there, so once that value
          # named a version already released, every branch build claimed to predate releases that
          # were already out and the what's new list replayed them.
          function Compare-Core($a, $b) {
            $x = @($a -split '\.') + @('0', '0', '0')
            $y = @($b -split '\.') + @('0', '0', '0')
            for ($i = 0; $i -lt 3; $i++) {
              $d = [int]$x[$i] - [int]$y[$i]
              if ($d -ne 0) { return $d }
            }
            return 0
          }

          $props = [xml](Get-Content Directory.Build.props)
          $aimedCore = ((@($props.Project.PropertyGroup.Version | Where-Object { $_ })[0]).Trim() -split '[-+]')[0]

          $describe = git describe --tags --long --match 'v[0-9]*' 2>$null

          $tag = ''
          $count = 0
          # The tag holds hyphens of its own, so the "-N-gSHA" tail is what anchors the match.
          if ($describe -match '^(?<tag>.+)-(?<count>\d+)-g[0-9a-f]+$') {
            $tag = $Matches.tag -replace '^v', ''
            $count = [int]$Matches.count
          }

          $latestStable = ''
          foreach ($candidate in @(git tag --list 'v[0-9]*')) {
            if ($candidate -notmatch '^v(?<core>\d+\.\d+\.\d+)$') { continue }

            $candidateCore = $Matches.core
            if (-not $latestStable -or (Compare-Core $candidateCore $latestStable) -gt 0) {
              $latestStable = $candidateCore
            }
          }

          $tagCore = $tag
          $tagPre = ''
          $dash = $tag.IndexOf('-')
          if ($dash -ge 0) {
            $tagCore = $tag.Substring(0, $dash)
            $tagPre = $tag.Substring($dash + 1)
          }

          if (-not $tag) {
            $version = "$aimedCore-alpha.${{ github.run_number }}"
          }
          elseif ($count -eq 0) {
            # Sitting on the tag itself, so this is that version rather than something after it.
            $version = $tag
          }
          elseif ((Compare-Core $aimedCore $tagCore) -gt 0) {
            # The props file aims past the last tag, so the branch is heading somewhere further
            # out than the next patch.
            $version = "$aimedCore-alpha.$count"
          }
          elseif ($tagPre -and $latestStable -and (Compare-Core $latestStable $tagCore) -ge 0) {
            # A beta branch does not contain main's merge commit, so git describe can still find
            # its beta tag after the matching stable release is out. Branch builds must move past
            # that release instead of becoming an update that ranks below it.
            $p = $latestStable -split '\.'
            $nextCore = ('{0}.{1}.{2}' -f $p[0], $p[1], ([int]$p[2] + 1))
            $base = if ((Compare-Core $aimedCore $nextCore) -gt 0) { $aimedCore } else { $nextCore }
            $version = "$base-alpha.$count"
          }
          elseif ($tagPre) {
            # Extending the tag's own name, so beta.1 with 7 commits on it ranks above beta.1 and
            # below beta.2. "alpha" stays in the tail because the version is read on its own in
            # bug reports and version lists, where beta.1.7 would pass for a release.
            $version = "$tagCore-$tagPre.alpha.$count"
          }
          else {
            # Past a stable tag. patch+1 is the lowest core above it and promises nothing, since
            # a later 1.3.0 or 2.0.0 still ranks above this.
            $p = $tagCore -split '\.'
            $version = ('{0}.{1}.{2}' -f $p[0], $p[1], ([int]$p[2] + 1)) + "-alpha.$count"
          }

          # Inno Setup needs four plain numbers, and $version carries a tail.
          $core = ($version -split '[-+]')[0] -split '\.'
          $vernum = '{0}.{1}.{2}.0' -f $core[0], $core[1], $core[2]

          Write-Host "describe: $describe"
          Write-Host "version: $version  numeric: $vernum"
          "VERSION=$version" | Add-Content $env:GITHUB_OUTPUT
          "VERNUM=$vernum" | Add-Content $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test RainWorldCompanion.sln -c Release

      # BuildBranch and BuildRunId become AssemblyMetadata attributes, which is how the list of
      # branch builds can mark the row the user is actually running. github.ref_name needs no
      # guard here the way a shared script would: this workflow only ever triggers on a branch,
      # so it can never be a tag name.
      - name: Publish
        run: >
          dotnet publish src/RainWorldCompanion/RainWorldCompanion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:BuildBranch=${{ github.ref_name }}
          -p:BuildRunId=${{ github.run_id }}
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o publish

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            $globs = @("${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe",
                       "$env:ProgramFiles\Inno Setup *\ISCC.exe",
                       "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this runner - installing it."
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe still not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.version.outputs.VERSION }}" `
                        "/DVersionNumeric=${{ steps.version.outputs.VERNUM }}" installer.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          # A constant, on purpose. The app downloads a branch build from
          # nightly.link/<owner>/<repo>/actions/runs/<run id>/<this name>.zip, so the name lands
          # in a URL path and is refused unless it is plain. A branch name would not be: half of
          # them hold a slash. The run id already identifies the build, and the row shown to the
          # user carries the branch, the commit and the run number from the API, so this name has
          # nothing left to carry.
          name: RainWorldCompanion-Setup
          path: dist_installer/RainWorldCompanion-Setup.exe
          # Long enough to test a branch, short enough that these never become an archive anyone
          # relies on. A branch build is not a release.
          retention-days: 30
          if-no-files-found: error
