name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink stamps the commit into the exe's informational version, and a shallow
          # checkout still has HEAD, so depth 1 would do. Full history costs seconds and keeps
          # `git describe` and anything else added later working.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read the version out of the tag
        id: version
        shell: bash
        run: |
          # The tag is the authority for what this build IS. It reaches the exe's version
          # resource, the informational version the updater compares against every release, and
          # the installer's AppVersion. Tagging v1.1.0 while the build called itself something
          # else would ship a copy that keeps being offered its own release as an update.
          VERSION=${GITHUB_REF#refs/tags/v}

          # The same grammar SemVer.TryParse accepts, so a tag this step passes is a tag the
          # shipped updater can read. Without the check, v1.0.1b publishes happily and is then
          # invisible: it holds no hyphen, so the test below calls it stable, and it fails to
          # parse, so every client skips it. Better to lose the build than the release.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "::error::Tag v$VERSION is not semantic versioning 2.0, so the updater cannot read it. Stable is three numbers, as in v1.2.0. A pre-release puts its name after a hyphen, as in v1.2.0-beta.1. A trailing letter with no hyphen, as in v1.2.0b, is the one to avoid."
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=v$VERSION" >> $GITHUB_OUTPUT

          # A hyphen is a semver pre-release tail, which is exactly what GitHub's pre-release
          # flag means, so the two can never disagree.
          if [[ "$VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

          # A Windows version resource needs four plain numbers, and Inno Setup knows nothing
          # about MSBuild, so the numeric form has to be handed to it. The tag is the only input
          # here, so there is no second file for a second parser to disagree with.
          NUMERIC=${VERSION%%-*}; NUMERIC=${NUMERIC%%+*}
          IFS=. read -r MAJOR MINOR PATCH _ <<< "$NUMERIC"
          echo "VERNUM=${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}.0" >> $GITHUB_OUTPUT

      # Ahead of the test and the publish for the same reason those sit ahead of the release: a
      # tag nobody wrote an entry for should cost seconds, not the whole build. The notes this
      # writes are read by the release page and by the app's own what's-new banner, so a release
      # that shipped the boilerplate alone would leave both saying nothing.
      - name: Read the release notes out of the changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          if (-not (Test-Path 'CHANGELOG.md')) {
            Write-Host "::error::CHANGELOG.md is missing, so there are no notes to publish for $version."
            exit 1
          }

          $lines = @(Get-Content 'CHANGELOG.md')

          # The version, then whitespace or the end of the line. Without that boundary, looking for
          # 1.2.0 also matches the "## 1.2.0-beta.1" heading above it and a stable release ships
          # its pre-release's notes.
          $heading = '^##\s+' + [regex]::Escape($version) + '(\s|$)'

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $heading) { $start = $i; break }
          }

          if ($start -lt 0) {
            Write-Host "::error::CHANGELOG.md has no '## $version' section. Rename the Unreleased heading to $version before tagging."
            exit 1
          }

          $body = [System.Collections.Generic.List[string]]::new()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            $body.Add($lines[$i])
          }

          $notes = ($body -join "`n").Trim()
          if ($notes.Length -eq 0) {
            Write-Host "::error::The '## $version' section in CHANGELOG.md is empty."
            exit 1
          }

          # Appended rather than kept in the release step, so the page reads as what changed first
          # and how to install it second. Single-quoted, so the markdown backticks stay literal.
          #
          # The marker is where the app cuts. It reads this same body for its what's-new banner,
          # and somebody who is already running the build does not need telling how to install it.
          # An HTML comment renders as nothing on the release page, so the cut costs the reader
          # there nothing either.
          $blurb = @(
            ''
            '<!-- app-notes-end -->'
            '### Installation'
            '**`RainWorldCompanion-Setup.exe`** is the one you want. It installs for you alone,'
            'asks for no admin rights, needs no .NET runtime, and starts the app when it''s done.'
            ''
            '### Already have it?'
            'Run the setup over the top. It keeps your install location and your shortcut choice,'
            'and it never touches your backups or your save library.'
            ''
            '### Uninstalling'
            'Removing the program leaves your backups and your library exactly where they are.'
            'They are the only copy of those saves, so nothing here deletes them, and you can'
            'delete the folder yourself if you want it gone.'
          )

          Set-Content -Path 'release-notes.md' -Value (@($notes) + $blurb) -Encoding utf8
          Write-Host "Release notes for ${version}:"
          Get-Content 'release-notes.md' | Write-Host

          # Said outright because the runner ends a pwsh step on $LASTEXITCODE when one is set,
          # and every path above that succeeds leaves it holding whatever ran last.
          exit 0

      # Before the publish, so a red suite cannot cut a release.
      - name: Test
        run: dotnet test RainWorldCompanion.sln -c Release

      # -p:Version is an MSBuild global property: it beats the assignment in Directory.Build.props
      # outright rather than merging with it, and reaches every project at once, so nothing in the
      # checkout has to be rewritten. The SDK splits it for us: InformationalVersion keeps the
      # whole string including any -beta.1 tail, while AssemblyVersion and FileVersion get the
      # numeric part.
      #
      # PublishSingleFile is off on purpose. A single-file WPF publish extracts its native
      # libraries to a temp folder at run time, which both hides the real layout from the
      # installer and hides those copies from the Restart Manager scan that CloseApplications
      # depends on. Inno Setup is the packaging here.
      #
      # PublishTrimmed is absent because WPF does not support trimming. That, plus the runtime
      # being in the box, is why the result is 252 files and around 136 MB, compressing to a
      # roughly 43 MB setup exe.
      - name: Publish
        run: >
          dotnet publish src/RainWorldCompanion/RainWorldCompanion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:PublishSingleFile=false
          -p:DebugType=none
          -o publish

      # windows-latest is expected to ship Inno Setup, but "expected to" is not a build guarantee,
      # so install it rather than fail. The resolved path is exported instead of relying on PATH,
      # because a fresh choco shim is not visible to a step that already started.
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            # Version-agnostic glob: choco installs into "Inno Setup 6" today and a later major
            # would be "Inno Setup 7". winget installs it per-user into %LOCALAPPDATA%\Programs,
            # which is not either Program Files root, and is the path a dev machine hits.
            $globs = @("${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe",
                       "$env:ProgramFiles\Inno Setup *\ISCC.exe",
                       "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this runner - installing it."
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe still not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      # Packages publish\ whole into dist_installer\RainWorldCompanion-Setup.exe.
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.version.outputs.VERSION }}" `
                        "/DVersionNumeric=${{ steps.version.outputs.VERNUM }}" installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.RELEASE_NAME }}
          # Written by the changelog step above: this tag's own section, then the install blurb.
          body_path: release-notes.md
          files: dist_installer/RainWorldCompanion-Setup.exe
          # Without this, a missing installer publishes a green release with no assets on it,
          # which the in-app updater then silently skips over.
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
